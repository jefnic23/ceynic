<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width: 600px; border-collapse: collapse; font-family: Arial, sans-serif; color: #243042;">
    <tr>
        <td style="padding: 0 0 20px; font-size: 16px; line-height: 24px;">
            To reset your password, use the button below:
        </td>
    </tr>
    <tr>
        <td style="padding: 0 0 24px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse;">
                <tr>
                    <td bgcolor="#2457a7" style="border-radius: 4px;">
                        <a href="{{ reset_url }}" style="display: inline-block; padding: 12px 20px; color: #ffffff; font-size: 16px; font-weight: bold; line-height: 24px; text-decoration: none;">Reset password</a>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
    <tr>
        <td style="padding: 0 0 8px; font-size: 14px; line-height: 21px;">
            If the button doesn't work, paste this link into your browser's address bar:
        </td>
    </tr>
    <tr>
        <td style="padding: 0 0 24px; font-size: 14px; line-height: 21px; overflow-wrap: anywhere; word-break: break-all;">
            <a href="{{ reset_url }}" style="color: #2457a7; text-decoration: underline;">{{ reset_url }}</a>
        </td>
    </tr>
    <tr>
        <td style="font-size: 14px; line-height: 21px;">
            If you did not request a password reset, simply ignore this message.
        </td>
    </tr>
</table>
