name: Check and deploy

on:
  push:
    branches: [develop, staging, main]
  pull_request:
    branches: [develop, staging, main]

jobs:
  frontend:
    name: Check frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # CI build values only; Heroku builds each deployed app with its own config vars.
      PUBLIC_API_URL: https://ceynic-api-staging-f8db8dfe3bb9.herokuapp.com
      PUBLIC_MEASUREMENT_ID: placeholder
      PUBLIC_RECAPTCHA_SITE_KEY: placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  backend:
    name: Check backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          working-directory: backend
      - run: uv python install
      - run: uv sync --frozen
      - run: uv run --no-sync ruff check src alembic

  staging:
    name: Deploy staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    concurrency:
      group: heroku-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh
      - name: Deploy backend (runs database migrations on release)
        uses: akhileshns/heroku-deploy@v3.15.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_email: ${{ secrets.HEROKU_EMAIL }}
          heroku_app_name: ceynic-api-staging
          appdir: backend
          dontautocreate: true
      # Each invocation of the action uses a Git remote named "heroku".
      - run: git remote remove heroku
      - name: Deploy frontend
        uses: akhileshns/heroku-deploy@v3.15.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_email: ${{ secrets.HEROKU_EMAIL }}
          heroku_app_name: ceynic-staging
          appdir: frontend
          dontautocreate: true
